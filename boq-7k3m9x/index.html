<title>JK BOQ</title>
<style>
:root{--bg:#e9ebe4;--card:#f8f9f4;--ink:#1d2629;--muted:#5b6669;--line:#cfd4c8;--accent:#1f5f7c;--bad:#b4261a}
@media (prefers-color-scheme:dark){:root{--bg:#161b1d;--card:#1e2528;--ink:#e6ebe8;--muted:#9aa6a8;--line:#36434a;--accent:#6fb3d2;--bad:#ff8a7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(360px,100%);display:grid;gap:12px}
.ph{display:flex;gap:3px}.ph i{width:7px;height:22px;border-radius:2px}
h1{font-size:20px;margin:0} p{margin:0;color:var(--muted);font-size:13px}
input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:transparent;color:inherit}
button{padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;min-height:18px}
</style></head>
<body>
<form id="f" autocomplete="on">
 <div class="ph" aria-hidden="true"><i style="background:#c0392b"></i><i style="background:#d4a017"></i><i style="background:#2f5fa7"></i></div>
 <h1>JK BOQ</h1>
 <p>Private. Enter your password to open.</p>
 <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required>
 <label><input type="checkbox" id="rem" checked> Remember on this device</label>
 <button type="submit" id="go">Open</button>
 <div class="err" id="err" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const d=b64(DATA);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12),additionalData:new TextEncoder().encode("jkpower")},k,d.slice(12));
  const htmlText=new TextDecoder().decode(pt);
  document.open(); document.write(htmlText); document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,256));
}
(async()=>{ try{ const s=localStorage.getItem(KEYNAME); if(s) await open_(b64(s)); }catch(e){ try{localStorage.removeItem(KEYNAME)}catch(_){} } })();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const btn=document.getElementById("go"), err=document.getElementById("err");
  btn.disabled=true; btn.textContent="Opening…"; err.textContent="";
  try{
    const raw=await derive(document.getElementById("pw").value);
    if(document.getElementById("rem").checked){ try{localStorage.setItem(KEYNAME,btoa(String.fromCharCode(...raw)))}catch(_){} }
    await open_(raw);
  }catch(x){ err.textContent="Wrong password. Try again."; btn.disabled=false; btn.textContent="Open"; try{localStorage.removeItem(KEYNAME)}catch(_){} }
});
